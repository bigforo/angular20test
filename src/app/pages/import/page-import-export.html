<ion-header>
  <ion-toolbar>
    <ion-title>Import/Export Page</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-textarea #dataTextarea [autoGrow]="true" [(ngModel)]="data" />
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button slot="start" fill="outline" color="success" (click)="get()"> Get from phone </ion-button>
    <ion-button slot="start" fill="outline" color="warning" (click)="save()"> Save to phone </ion-button>
    <ion-button slot="start" fill="outline" (click)="selectAll(dataTextarea)"> Select all </ion-button>
    <ion-button slot="end" id="import-confirm-alert" color="danger" fill="outline"> Import</ion-button>
  </ion-toolbar>
</ion-footer>

<ion-alert
  trigger="import-confirm-alert"
  header="Import history?"
  message="Importing will overwrite your current workout history."
  [buttons]="importAlertButtons"
  (didDismiss)="importConfirmation($event)"
/>
